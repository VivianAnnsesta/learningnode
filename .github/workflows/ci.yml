name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/create-seed-database.js
        id: empty_seed
      - uses: actions/upload-artifact@v6
        if: steps.empty_seed.outcome == 'success'
        with:
          name: versioned-empty-seed
          path: |
            web/prisma/seed.db
            web/test-results/empty-seed-validation.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run audit:release
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:encoding
      - run: npm run test -- --maxWorkers=1 --no-file-parallelism
      - run: npx prisma validate
        env:
          DATABASE_URL: file:./ci-schema-validation.db
      - run: npm run fixture:migration-legacy
      - run: npm run verify:migration-fidelity
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: full-browser-evidence
          path: web/test-results/browser-*/
          if-no-files-found: ignore

  desktop-release-gates:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run build:app
      - run: npm run verify:electron-runtime
      - run: npm run verify:electron-upgrade
      - run: npm run verify:electron-security
